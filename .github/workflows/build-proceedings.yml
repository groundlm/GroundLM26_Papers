name: Build GroundLM proceedings

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Compile and package proceedings
    runs-on: ubuntu-latest
    timeout-minutes: 90

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Install LaTeX toolchain
        run: |
          sudo apt-get update
          sudo apt-get install --yes \
            texlive-latex-base \
            texlive-latex-recommended \
            texlive-latex-extra \
            texlive-fonts-recommended \
            texlive-fonts-extra \
            texlive-lang-all \
            texlive-bibtex-extra \
            poppler-utils

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"
          cache: pip

      - name: Download official aclpub2
        run: git clone --depth 1 https://github.com/rycolab/aclpub2.git "$RUNNER_TEMP/aclpub2"

      - name: Install aclpub2 dependencies
        run: |
          python -m pip install --upgrade pip
          # PyYAML 5.3.1 is pinned by aclpub2 and needs the pre-3.0 Cython
          # build helper on older Python versions.
          python -m pip install "Cython<3"
          python -m pip install -r "$RUNNER_TEMP/aclpub2/requirements.txt"

      - name: Verify excluded paper
        run: |
          python - <<'PY'
          import yaml
          from pathlib import Path

          path = Path("aclpub-prep/all_materials/papers.yml")
          papers = yaml.safe_load(path.read_text())
          ids = {str(p["id"]).zfill(3) for p in papers}
          if "008" in ids:
              raise SystemExit("Paper 008 must be excluded from papers.yml")
          print(f"Proceedings input contains {len(papers)} papers; 008 is excluded.")
          PY

      - name: Generate proceedings with aclpub2
        env:
          PYTHONPATH: ${{ runner.temp }}/aclpub2
        run: |
          rm -rf aclpub-prep/output build
          python "$RUNNER_TEMP/aclpub2/bin/generate" \
            aclpub-prep/all_materials \
            --proceedings \
            --overwrite \
            --nopax \
            --outdir aclpub-prep/output

      - name: Verify generated proceedings
        run: |
          test -s build/front_matter.pdf
          test -s build/proceedings.pdf
          test -s aclpub-prep/output/proceedings.pdf
          pdfinfo aclpub-prep/output/proceedings.pdf | grep -E '^(Pages|File size):'

      - name: Package aclpub2 output
        run: |
          tar -czf aclpub-prep/groundlm-proceedings.tgz \
            -C aclpub-prep output
          ls -lh aclpub-prep/groundlm-proceedings.tgz

      - name: Publish package as a GitHub Release asset
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          tag="proceedings-${GITHUB_RUN_ID}"
          gh release create "$tag" aclpub-prep/groundlm-proceedings.tgz \
            --repo "$GITHUB_REPOSITORY" \
            --title "GroundLM proceedings build ${GITHUB_RUN_NUMBER}" \
            --notes "Generated from commit ${GITHUB_SHA}. Paper 008 is excluded from the proceedings."
          echo "RELEASE_TAG=$tag" >> "$GITHUB_ENV"

      - name: Commit latest build manifest to main
        run: |
          sha256sum aclpub-prep/groundlm-proceedings.tgz > /tmp/groundlm-proceedings.sha256
          {
            echo "# Latest GroundLM proceedings build"
            echo
            echo "- Workflow run: ${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}"
            echo "- Release: ${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/releases/tag/${RELEASE_TAG}"
            echo "- Source commit: ${GITHUB_SHA}"
            echo "- Package: groundlm-proceedings.tgz"
            echo "- SHA256: $(cut -d ' ' -f 1 /tmp/groundlm-proceedings.sha256)"
            echo "- Paper 008: excluded"
          } > aclpub-prep/latest-build.md
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add aclpub-prep/latest-build.md
          if git diff --cached --quiet; then
            echo "Build manifest is unchanged."
          else
            git commit -m "Record proceedings build ${GITHUB_RUN_NUMBER}"
            git push origin HEAD:main
          fi

      - name: Save generated proceedings as artifact
        uses: actions/upload-artifact@v4
        with:
          name: groundlm-proceedings-${{ github.run_number }}
          path: |
            aclpub-prep/groundlm-proceedings.tgz
            aclpub-prep/output/
          if-no-files-found: error
          retention-days: 90

      - name: Add download instructions to run summary
        run: |
          {
            echo "## GroundLM proceedings build"
            echo
            echo "The generated package and the complete aclpub2 output were saved as the artifact \`groundlm-proceedings-${{ github.run_number }}\`."
            echo
            echo "A durable copy is also attached to the GitHub Release created by this run; its link is recorded in \`aclpub-prep/latest-build.md\`."
            echo
            echo "The package is \`aclpub-prep/groundlm-proceedings.tgz\`."
          } >> "$GITHUB_STEP_SUMMARY"
