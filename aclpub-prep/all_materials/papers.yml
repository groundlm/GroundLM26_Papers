  title: 'E-SENS: Exclusion-Sensitive Penalization for Negative-Constraint Retrieval'
  abstract: Retrieval-augmented language models can fail to respect negative constraints
    when the retriever supplies evidence about concepts the user explicitly excluded.
    Beyond explicit negation, queries may ask for answers that include one concept
    while excluding another, or for entities that belong to a category but differ
    from a closely related instance. Because the excluded concept still appears in
    the query text, dense retrievers may assign high similarity to documents about
    that concept even when the user asks to avoid it. We introduce E-SENS, a training-free
    reranking method for negation-sensitive retrieval. E-SENS extracts a compact trap
    query for the excluded side and subtracts trap-query similarity from the original-query
    retrieval score. On ExcluIR, E-SENS shows a clear recall-violation trade-off across
    four embedding models and reduces trap retrieval at recall-preserving settings.
  archival: true
