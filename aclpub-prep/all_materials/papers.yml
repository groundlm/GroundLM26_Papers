  file: 015.pdf
  title: Grounding or Lexical Overlap? A Matched-Pair Study of Internals-Based Faithfulness
    Probes
  abstract: 'We provide a confound-controlled methodology and a released "wrong-question"
    diagnostic for internals-based, reference-free hallucination detection, which
    treats context-faithfulness (is an answer entailed by the context?) as a linear
    residual-stream direction. In the standard extractive setup, faithfulness is almost
    perfectly correlated with lexical overlap (r=0.99), so an apparent "grounding
    probe" may be a string-matching detector. Our matched Support×Overlap construction
    partially decouples the two (halving the confound to r=0.50), and the diagnostic
    fools an off-the-shelf NLI model. Across four instruction-tuned 7–9B families:
    (i) within the overlap-controlled stratum a support contrast is linearly decodable,
    but a no-context ablation shows it reflects question–answer compatibility rather
    than context use, and is inseparable from factoid-correctness by construction;
    (ii) it aligns across families up to a linear map, yet answer-length, overlap,
    and factuality directions align equally well, a generic matched-stimulus property,
    not grounding-specific; (iii) on the three families we could extract, the synthetic
    direction does not transfer to real hallucinations, scoring below NLI, confidence,
    and lexical overlap on RAGTruth, where only an in-domain probe trained on human
    labels recovers a usable signal.'
  archival: true
  decision: Findings
