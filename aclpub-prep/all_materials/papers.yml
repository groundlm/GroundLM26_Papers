  title: 'Findings of the First GroundLM Shared Tasks: Evaluating Grounded Language
    Models Across Visual and Scientific Evidence'
  abstract: 'The first GroundLM shared tasks evaluate whether language models can
    identify the evidence behind an answer, rather than merely produce a correct answer
    in isolation. GoldenViewVQA requires a model to answer a multiple-choice question
    about six synchronized driving-camera views and identify the supporting view.
    LitTraceQA requires systems to retrieve scientific papers, locate answer-bearing
    evidence, and return multiple-choice or structured-table answers. We summarize
    the task design, submitted systems, official results, and recurrent failure modes.
    Among teams that submitted system reports, the best official joint accuracy on
    GoldenViewVQA is 0.8814. Answer accuracy is consistently higher than view accuracy,
    while macro view accuracy remains lower than micro accuracy, exposing both attribution
    errors and view imbalance. On the required LitTraceQA test set, the best score
    among teams that submitted system reports is 0.8002. Paper retrieval approaches
    saturation for several systems, but evidence F1 and structured-table accuracy
    remain substantially lower. Across both tasks, the central finding is consistent:
    producing a correct answer is easier than recovering the exact evidence representation
    required to justify it. We also report an optional 4,901-question LitTraceQA diagnostic
    split, whose unverified labels make it useful for stress testing but not for ranking
    systems on the main task.'
  archival: true
  decision: Tasks
