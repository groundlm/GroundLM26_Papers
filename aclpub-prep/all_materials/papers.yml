  file: 077.pdf
  title: 'Agents Out of Bounds: A Taxonomy of Architectural Drift and a Deployment-Ready
    Guardrail Framework for LLM Coding Agents'
  abstract: 'LLM coding agents such as GitHub Copilot, Cursor, and Claude Code now
    author a large share of the code that teams merge, and they are active in an estimated
    22% of public GitHub projects. The output is fast and usually correct in the small.
    The trouble is that an agent optimizes for the task in front of it, not the global
    shape of the system. That cost is now measurable. Agent adoption causally raises
    code complexity by about 42% and static-analysis warnings by about 30%, and the
    most common reason an agent''s patch fails is a shallow grasp of the surrounding
    architecture. We call this widening gap between a system''s intended and realized
    architecture architectural drift. The obvious remedy, stating the rules in the
    prompt, does not hold at repository scale; the evidence is that only deterministic,
    executable enforcement conforms reliably. We make two contributions. The first
    is a taxonomy of LLM-induced architectural drift: five deterministically enforceable
    families plus one open frontier, each tied to the architectural primitive it corrupts
    and the model behavior that produces it. The second is GyroCompass, a deployment-oriented
    framework. It extracts a living architecture model from source, serves that model
    to the agent as planning-time context (prevention), and enforces it through a
    deterministic gate that, run in CI, cannot be bypassed (detection). On a labeled
    benchmark of 208 cases (104 violations, 104 realistic decoys) spanning Python
    and JavaScript/TypeScript, GyroCompass reaches 88.5% recall at a 5.8% false-positive
    rate, versus 57.7% recall at 42.3% false positives for a naive pattern baseline
    (McNemar p<0.001); on the original 54-case core it separates violations from look-alikes
    at 100% recall and zero false positives. Head-to-head on matched subsets, a five-tool
    comparison (Semgrep, Bandit, CodeQL, pip-audit, import-linter) reaches at most
    65% recall. Extraction runs at over 800 files per second, cheap enough to apply
    on every commit, and its output matches independently constructed references at
    0.95-1.0 component precision/recall across four repositories. In an added-line
    analysis of 1,779 commits of a 10k-star production repository whose maintainers
    document their layering rules for AI agents, violations of the documented intent
    continued to land, including after an agent-facing AGENTS.md stated the rules,which
    is the enforcement gap GyroCompass closes. On the prevention side, serving the
    architecture to a coding agent as context shifts its layering behavior, but the
    effect is model-dependent across three model families, which is itself why the
    deterministic gate, not prompt context, is the binding guarantee. We discuss the
    prevention/detection trade-off, lessons from instrumenting agent workflows, and
    what reliable guardrails ask of a team in practice. GyroCompass is a working system
    intended for real-world deployment; benchmark, harness, and analysis scripts are
    released.'
  archival: true
  decision: Commitment
  openreview_id: wv9GCr1SyG
