  file: 027.pdf
  title: 'Staged Linguistic Seeding: Grounded Query Expansion for Verified-Unit QA
    in AI Contact Centers'
  abstract: 'Customer-service QA in an AI contact center (AICC) runs under deployment
    constraints that benchmark QA misses: tight voice-hotline latency and a high cost
    for unsupported or wrong automatic answers. We deploy a system that answers only
    from a closed set of verified QA units: it returns a retrieved unit verbatim,
    or routes to clarify/abstain/handoff.The index is enriched offline by staged linguistic
    seeding (SLS): a human authors a per-unit world-grounded slot recipe, gpt-4.1-mini
    renders it into variants, and a light human gate filters them, one methodology
    reused across both domains, so inference stays a single retrieval pass with no
    query-time generation.On held-out query variants (in-distribution recipe reformulations)
    from two industrial domains, SLS is the dominant retrieval lever, lifting hybrid
    R@1 to 0.881/0.930 (+0.27/+0.34); the gain holds across all five retrievers we
    test. The win is the design, not the volume: at the same gpt-4.1-mini, SLS beats
    a budget-matched doc2query by +0.20/+0.32, and a cross-provenance control provides
    additional evidence of transfer across generated-query distributions; the embedding
    choice is secondary. Verified-unit answering also removes free-form generation''s
    unsupported-content surface (7–13% vs. ≈0%). We report this as an honest application
    study, including negative results.'
  archival: true
  decision: GroundLM
