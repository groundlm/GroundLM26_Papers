  file: 007.pdf
  title: 'Retrieval–Reasoning Processes for Multi-hop Question Answering: A Four-Axis
    Design Framework and Empirical Trends'
  abstract: Multi-hop question answering (QA) requires systems to iteratively retrieve
    evidence and reason across multiple hops. While recent RAG and agentic methods
    report strong results, the underlying retrieval–reasoning process is often left
    implicit, making procedural choices hard to compare across model families. This
    survey takes the execution procedure as the unit of analysis and introduces a
    four-axis framework covering overall execution plan, index structure, next-step
    control strategies and triggers, and stop/continue criteria. Using this schema,
    we map representative multi-hop QA systems and synthesize reported ablations and
    empirical tendencies on standard benchmarks, including HotpotQA, 2WikiMultiHopQA,
    and MuSiQue. We highlight recurring trade-offs among effectiveness, efficiency,
    and evidence faithfulness, and conclude with open challenges for retrieval–reasoning
    agents, including structure-aware planning, transferable control policies, and
    robust stopping under distribution shift.
  archival: true
  decision: GroundLM
  openreview_id: qehXtMNcr0
