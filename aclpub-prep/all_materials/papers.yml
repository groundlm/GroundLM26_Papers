  file: 002.pdf
  title: 'AAgiSphere-CORE: A Multi-Dimensional Co-Optimization Framework for Autonomous
    Prescriptive Maintenance in Smart Manufacturing'
  abstract: Intelligent workflows for smart manufacturing reliability and maintenance
    (RxM) are transitioning from static, sequential multi-agent systems toward autonomous,
    dynamic decision-making. However, a critical gap persists between agent coordination
    and the holistic co-optimization required across predictive performance, computational
    resources, and domain-specific business logic. To address this, we propose \textbf{AgiSphere-CORE},
    a novel framework centered on a \textbf{Co-Optimization Core (COC)}. The COC maintains
    a unified \textit{Collaborative State Vector} and solves a constrained optimization
    problem to maximize the \textit{Collaborative Utility} $J_{co}$, dynamically orchestrating
    specialized agents for resources, models, and logic. This enables a paradigm shift
    from sequential to co-optimization-driven autonomy. Extensive evaluation on multiple
    manufacturing tasks, including classification, regression, and anomaly detection,
    demonstrates that AgiSphere-CORE consistently outperforms baselines, achieving
    superior predictive performance (e.g., 97.3\% accuracy, 0.902 F1-score), improved
    resource efficiency (15\% faster workflow time), and higher estimated domain cost
    savings (\$148.7K). Ablation studies confirm the critical role of the COC and
    the adaptive learning mechanism. A detailed case study further illustrates the
    framework's transparent, utility-driven trade-offs. We conclude that AgiSphere-CORE
    provides a robust, holistic foundation for next-generation autonomous RxM systems
    in smart manufacturing.
  archival: true
  decision: GroundLM
  openreview_id: INfALI5FPO
- id: '003'
  authors:
  - first_name: Tian
    last_name: Zihan
    name: Tian Zihan
    username: ~TianZihan1
  attributes:
    paper_type: long
  file: 003.pdf
  title: 'MSRA: A Parameter-Efficient Spectral Correction for Local Attention — Where
    It Helps, and Where It Fails'
  abstract: 'Restricting attention to a sliding window makes long documents affordable,
    but it discards everything beyond the window. This paper asks what can be recovered
    when the model is already trained, its weights are frozen, and the budget for
    new parameters is only a few tens of thousands. We propose Multi-scale Spectral
    Residual Attention (MSRA): a far-field branch grafted onto the last few layers
    of a frozen model, which condenses out-of-window history through smoothly distance-decayed
    weights and adds it back to the attention output—roughly 9K–45K trainable parameters,
    plus minimal 8-to-16-scalar probes for attribution. On PG-19 long-form fiction,
    the branch closes up to 31.7% of the perplexity gap between local and full attention,
    with gains stable across two architectures, multiple seeds, and the official test
    partition. The attribution proves sharper than the headline: 16 learnable output-gain
    scalars alone close 26.4%, returns accelerate with grafting depth, the carefully
    designed kernel structure and gating contribute only secondarily—and a budget-matched
    LoRA closes 87.4%, indicating that the gap is mostly generic capacity rather than
    a missing far-field pathway. Retrieval experiments complete the map: the correction
    is a statistical smoother that helps just beyond the window, slightly hurts precise
    in-window prediction, recovers essentially nothing at genuine long distance, and
    does not transfer to task metrics—while slowing prefill two-to-three-fold and
    leaving decoding unaffected. These results bound what a lightweight spectral correction
    can and cannot recover, forming a reproducible decision reference for local long-context
    design.'
  archival: true
  decision: Findings
  openreview_id: CQ482Y2xBa
