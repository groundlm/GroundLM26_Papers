  title: 'Faithfulness Is Not Free: Auditing Offline KV-Cache Quantization in Retrieval-Augmented
    Generation'
  abstract: 'Retrieval-augmented generation (RAG) systems can precompute and store
    key-value (KV) caches of retrieved documents to avoid re-encoding the same context
    for every query. Quantizing these offline caches reduces storage cost, but existing
    work largely evaluates compression through accuracy alone and does not ask whether
    the generated answers remain faithful to the retrieved evidence. This distinction
    is important because a model can preserve the correct answer string while weakening
    its grounding in the provided context. We audit Qwen2.5-7B-Instruct under BF16,
    INT8, and INT4 offline KV-cache settings on RGB and HotpotQA, measuring both answer
    accuracy and faithfulness using a hallucination detector, NLI entailment, and
    an LLM judge. INT8 is nearly lossless across accuracy and faithfulness metrics.
    In contrast, INT4 reduces accuracy and, more critically, degrades faithfulness
    even on examples where the answer remains factually correct: over 90% of faithfulness
    flips are negative. The degradation increases under noisier retrieval and larger
    retrieval depth. These results show that compressed RAG systems cannot be validated
    by EM or F1 alone; faithfulness must be audited before low-bit offline KV caches
    are deployed.'
  archival: true
  decision: GroundLM
  openreview_id: qu9ZxcS4zN
