  file: 026.pdf
  title: 'The Citation Expansion Trap: Operating-Point Control for Fixed-Answer Multi-Hop
    RAG Citation Repair'
  abstract: 'Multi-hop retrieval-augmented generation systems often produce answers
    with incomplete or noisy citation sets. When the answer text is fixed, citation
    repair may seem to require only adding retrieved evidence. We show that this view
    is incomplete: in multi-hop settings, expansion that recovers missing support
    can also introduce plausible distractors into the evidence bundle. We study fixed-answer
    citation-set repair as a diagnostic protocol for reporting policies as operating
    points between support-ID coverage and distractor control. Across a calibrated
    5,000-example HotpotQA diagnostic and Qwen2.5-generated outputs on HotpotQA, MuSiQue,
    and 2Wiki, cross-encoder repair yields cleaner support-ID operating points than
    BM25 expansion on HotpotQA and 2Wiki, while MuSiQue shifts the policy into a higher-distractor-cost
    regime under harder compositional transfer. We do not claim universal transfer
    of absolute performance from HotpotQA alone; the cross-dataset pattern is instead
    consistent with mechanism-level transfer of the support-distractor operating-point
    geometry. A single-author audit of 450 unique generated-output cases plus 60 duplicate
    checks reinforces this caution: support-ID coverage and claim-level citation support
    can diverge. We therefore recommend an operating-point scorecard for citation
    repair and separate support-ID diagnostics from stronger claim-level faithfulness
    claims.'
  archival: true
  decision: GroundLM
