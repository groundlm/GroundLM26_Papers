  file: 044.pdf
  title: 'Eval-Pair Matrix: Answer-Paired Meta-Evaluation of LLM Judges for Grounded
    RAG'
  abstract: LLM-as-a-judge evaluation is widely used for retrieval-augmented generation
    (RAG), but reusing a model as generator and judge complicates identifying self-leniency.
    We introduce Eval-Pair Matrix, a controlled meta-evaluation protocol for source-grounded
    RAG. Starting from GaRAGe, we induce one hidden answer-causal contradiction per
    record, generate answers from perturbed passages with GPT, Grok, and Gemini, and
    use the same models as blind judges against the original passages. The experiment
    contains 300 core records, 897 labeled outputs, and 2,683 verdicts in a crossed
    3×3 matrix; the primary analysis uses 275 validated records. We estimate same-model
    effects by pairing judges on the exact same candidate answer. Diagonal and off-diagonal
    F1 are similar, and aggregate paired recall is near zero for the three tested
    endpoints (−0.5 pp; 95% cluster-bootstrap CI [−2.7,+1.7]). Matching judges flag
    answers that avoided the induced claim less often (−4.3 pp). A targeted human
    evaluation classifies reviewed apparent false positives as alternate source-error
    detections, adoption-label mistakes, or unclear cases; none were adjudicated as
    genuine false alarms. We recommend full matrices, answer-paired effects, behavior
    strata, and label-task alignment.
  archival: true
