  title: Cross-Modal Grounding for Calibrated Confidence in Vision Language Models
  abstract: We introduce a novel approach for calibrating uncertainty quantification
    (UQ) tailored for visual language models (VLMs). Existing state-of-the-art UQ
    methods rely on consistency among multiple responses, but often report higher
    confidence when the model is consistently incorrect, leading to poorly calibrated
    confidence. To address this, we leverage cross-modal consistency by grounding
    back the textual responses to visual inputs. The confidence from the grounding
    model (GM) is used to calibrate the overall confidence. Given that using a GM
    adds its own uncertainty, we apply temperature scaling to calibrate the GM’s confidence
    in the accuracy of the generated responses. We comprehensively evaluate the proposed
    approach across diverse range of settings, including datasets with varying visuo-linguistic
    complexity, Q\&A and caption generation tasks, general visual and specialized
    medical contexts, VLMs differing in scale, openness, and different categories
    of GMs. Experimental results show that our approach consistently improves confidence
    calibration, with expected calibration error (ECE) improvements ranging from $32.5\%$
    to $96.7\%$ over both self and non-self consistency-based baselines. Code is available
    here https://github.com/trilokpadhi/Multimodal-Uncertainty-Quantification.
  archival: true
