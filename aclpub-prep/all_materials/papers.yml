  file: 019.pdf
  title: 'Lifecycle Faithfulness for Grounded Retrieval-Augmented Generation: Benchmarks,
    Evaluation, and the Vera-Life Controller'
  abstract: 'Retrieval-augmented generation treats citation as a default proxy for
    reliability, yet a cited passage can support a claim and still be obsolete, superseded,
    contradicted, or invalid at the user''s target time. We name this failure a citation-supported
    lifecycle error and define lifecycle faithfulness: a claim-level criterion that
    requires semantic support, target-time validity, non-supersession, and provenance.
    We release Vera-Life-Eval, an 8,500-question benchmark with 41,203 versioned evidence
    pieces across six lifecycle settings (current, past, stale-only, update, conflict,
    and multi-hop), and Vera-Life, a low-training modular controller that builds an
    evidence-state graph, selects claim-evidence-time contracts, and chooses among
    answer, warn_stale, explain_conflict, retrieve_more, and abstain, emitting a claim-level
    lifecycle ledger. On a shared Qwen3-8B generator, Vera-Life raises LifeEM from
    .374 (best prompt-only baseline) to .623, and remains effective under timestamp-only
    (.584) and text-only (.504) regimes. Same-action controls, metadata isolation,
    and source-disjoint transfer across product, policy, scientific, and news evidence
    show that the gains are not an artefact of output format or Wikipedia revision
    cues. The next mission for RAG is not merely to cite evidence, but to know whether
    that evidence is still alive.'
  archival: true
  decision: Findings
