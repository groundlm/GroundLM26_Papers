  title: 'Memory Makes the Difference: Evaluating How Different Memory Roles Shape
    Conversational Agents'
  abstract: 'Memory is a critical component of modern conversational systems. Prior
    research on memory mechanisms in RAG-based conversational systems has focused
    on how memory is stored and retrieved. However, less is known about how memories
    with different functional roles influence response quality, shape agents'' responses
    across conversational contexts, and lead to distinct response behaviors. Existing
    evaluations are also largely reference-based, often missing response nuances that
    address users'' preferences differently. In this work, we study the impact of
    different memory types on agent responses. We present a fine-grained taxonomy
    of conversational memory, classify retrieved memories by functional role, and
    design a user-centric evaluation framework that simulates user perspectives. Through
    comparative experiments on long-term datasets and frontier LLMs, our analysis
    reveals differentiated effects of memory: e.g., clarifying memory is associated
    with improved factual accuracy and constraint awareness, making responses more
    correct and personalized, while irrelevant memory reduces topic relevance and
    degrades constraint awareness. These findings show that, despite the power of
    frontier LLMs, different memory types can be leveraged to produce responses better
    aligned with a user''s stated constraints, and motivate further research in this
    direction.'
  archival: true
  decision: GroundLM
  openreview_id: q6THlzdjqH
