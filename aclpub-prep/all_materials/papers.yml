  file: 081.pdf
  title: 'PageRecall: Measuring Page Selection in Literature-Grounded Question Answering'
  abstract: 'We describe our system for LitTraceQA (GroundLM @ EMNLP 2026): given
    a research question, retrieve the relevant papers from a pool of 27,487, cite
    the page and the table or figure where the answer lives, and answer in a requested
    format. Our main finding is that evidence grounding is limited by retrieval, not
    by reading. The page selector put the annotator''s page, which we call the gold
    page, in front of the model that locates evidence only about half the time (52.6%
    gold-page recall), while that model, given the page, cited the right one in 45
    of the 48 locators it emitted (94%). When the page was missing it rarely said
    so: of 45 such cases it returned nothing 14 times, a wrong page 24 times, and
    a correct page 7 times, so the pipeline failed quietly almost twice as often as
    it failed visibly. Since the failure was that the right page was never shown,
    the fix is to stop choosing: each retrieved paper fits in the model''s context,
    so we show it whole. Page ranking survives only as a fallback inside papers too
    long to fit, which no test-split paper was, and gold-page recall reaches 100%
    on the papers we can parse. Separately, questions that identify their target by
    position rather than content, such as "the first author of the 24th reference",
    are served by parsing rather than retrieval: we resolve the bibliography into
    an addressable list, which also supplies identifiers the evidence metric scores.
    The final system scores 0.762 paper $F_1$, 0.441 evidence $F_1$ and 0.920 multiple-choice
    accuracy on the held-out test split. Because the pipeline depends on a closed
    model without seed control, we release a harness that verifies the paper''s central
    claims against committed artifacts.'
  archival: true
  decision: Tasks
