  title: A Non-Visual Baseline for Multi-View Visual Question Answering on GoldenViewVQA
  abstract: 'We present a non-visual baseline for GoldenViewVQA, a benchmark for multi-view
    visual question answering with evidence-source identification. The baseline reaches
    a joint accuracy of 0.7119 on the hidden test split and uses no visual input.
    Its view prediction is the fixed label CAM_FRONT, which reaches 0.7797 view accuracy
    on the test split, while Qwen3-4B predicts the answer from the question, answer
    options, and non-visual metadata with 0.8475 answer accuracy. These results show
    that the current benchmark permits substantial performance without image access.
    We analyze the supporting-view prior and performance across question groups, and
    discuss benchmark changes that could reduce reliance on non-visual shortcuts.
    We present this run as a strong non-visual baseline, not as evidence that vision
    is unnecessary for driving question answering. Code: https://github.com/aravind-mandiga/groundlm-goldenviewvqa.'
  archival: true
