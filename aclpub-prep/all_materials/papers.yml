  file: 022.pdf
  title: Does RAG Know When Retrieval Is Wrong? Diagnosing Context Compliance under
    Knowledge Conflict
  abstract: 'Retrieval-Augmented Generation (RAG) is usually evaluated by whether
    the final answer is correct. Under knowledge conflict, this hides a key question:
    did the model follow retrieved evidence, rely on its parametric prior, or produce
    a post-hoc rationale? We study this as context compliance, the regime in which
    retrieved context controls the answer even when it conflicts with the model''s
    prior knowledge. We introduce Context-Driven Decomposition (CDD), an inference-time
    diagnostic intervention that elicits contextual and prior answers, isolates the
    conflicting premise, and records a resolution trace that can be perturbed. Across
    Epi-Scale stress tests, TruthfulQA misconception injection, and cross-model reruns,
    CDD makes three behaviors visible. First, misleading retrieval can severely degrade
    accuracy: under worst-case injected context (a TruthfulQA misconception-injection
    probe), Standard RAG reaches only 15.0%. Second, better answers need not share
    the same mechanism: CDD improves adversarial accuracy on Gemini-2.5-Flash and
    shows directional gains across Claude variants, yet trace-perturbation sensitivity
    is high only on Gemini. Third, explicit decomposition improves controlled-conflict
    robustness over a conflict-aware instruction baseline on localized factual conflicts,
    with the clearest margins on Entity Swap (88.0% vs 79.3%) and Logical Contradiction
    (83.2% vs 75.4%). We frame RAG conflict handling as an observability problem.'
  archival: true
  decision: GroundLM
  openreview_id: 2N9OSYS8Mv
