  file: 014.pdf
  title: 'CacheWeaver: Cache-Aware Evidence Ordering for Efficient Grounded RAG Inference'
  abstract: Retrieval-Augmented Generation (RAG) improves factual grounding, but it
    also lengthens prompts and raises prefill cost. Prefix caching in serving engines
    such as vLLM reduces this cost only when requests share the same token prefix.
    In grounded generation, however, adjacent queries may retrieve overlapping evidence
    in different orders, so set overlap does not become reusable prefix overlap. We
    present CacheWeaver, a lightweight prompt-layer method for cache-aware evidence
    ordering. The method keeps a prefix tree over recently served evidence sequences
    and uses a greedy walk to place the most reusable prefix first, while leaving
    the serving engine and retrieved evidence set unchanged. Across three vLLM configurations
    the method lowers median time-to-first-token (TTFT) by about 20 to 33% relative
    to retrieval-order prefix caching, without hurting answer quality in our QA tests.
    The greedy policy reaches 97.5% of the median TTFT gain from oracle ordering,
    which indicates that most reusable prefix locality can be recovered by a simple
    scheduling layer between retrieval and inference.
  archival: true
  decision: Findings
