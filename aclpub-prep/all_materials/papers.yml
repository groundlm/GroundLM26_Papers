  file: 042.pdf
  title: 'RuleChef: Grounding LLM Task Knowledge in Human-Editable Rules'
  abstract: We present RuleChef, a framework that uses large language models (LLMs)
    to generate executable rules for NLP tasks such as text classification, Named
    Entity Recognition (NER), or relation extraction. Rules are generated based on
    a task description and a set of labeled examples, then they are iteratively improved
    based both on additional examples and on human feedback over existing rules. RuleChef
    can also be used to bootstrap rules using the observed input-output pairs from
    any existing model for a given task. LLMs are used only at learning time, synthesizing
    rules and iteratively patching them based on failures measured on a held-out split.
    The result of this process is a fast, deterministic, and inspectable rule system.
    Preliminary evaluation is performed on both classification and NER tasks. We release
    RuleChef as open-source software under an Apache 2.0 license.
  archival: true
