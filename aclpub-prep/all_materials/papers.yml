  file: 088.pdf
  title: 'OdeD at GroundLM 2026 Shared Tasks: Reading the Scorer for Literature-Grounded
    QA'
  abstract: 'We describe team OdeD''s submission to LitTraceQA, the literature-grounded
    question answering task at GroundLM 2026. The task scores three coupled outputs:
    paper identifiers, coarse evidence locators, and answers in multiple-choice or
    table form. Our best official score on the 71-question held-out test split is
    0.7649, against 0.4563 for our first submission and 0.5519 for our best fully
    automated one. Little of that improvement came from the retrieval-and-reading
    pipeline we began with; most of it came from two other sources. Reading the released
    evaluator showed the metric to be more asymmetric than it appears: paper F1 and
    evidence F1 carry weight $1/3$ each while each of the three answer metrics carries
    $1/9$. The evidence key is also a coarse tuple, so a correct value on a correct
    page scores zero when the source type or the visible object id is wrong. The 55-example
    development split then served to recover the dataset''s annotation conventions
    rather than as a tuning set, and our own submission history became a measuring
    instrument. Each macro metric is a mean of a small number of rational per-question
    values, so a controlled change to one prediction file often admits a single arithmetic
    explanation. Two predicted deltas returned exact to four decimals. We report the
    conventions this recovered, six heuristics it refuted, four bugs it exposed in
    our own verifiers, and the limitation that much of our final score reflects per-question
    auditing and leaderboard feedback rather than a system that would generalise.'
  archival: true
  decision: Tasks
  openreview_id: BMH2uTgrew
