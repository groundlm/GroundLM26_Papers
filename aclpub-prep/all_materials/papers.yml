  title: 'CoSched-Cert: Faithful Multi-Turn Scheduling Dialogue via Solver-Verified
    Certificates'
  abstract: Multi-turn scheduling assistants must preserve constraint edits and distinguish
    solver evidence from language-model interpretations. We present CoSched-Cert,
    a dialogue protocol combining a typed scheduling language, solver-distinguishing
    clarification, cost-based conflict localization, verified repair synthesis, and
    lexical certificate auditing. Its guarantees are conditional on the encoded problem
    and supplied candidate interpretations; lexical support does not establish semantic
    entailment. SchedNL-Bench-Cert contains 1,000 synthetic Chinese/English utterances
    and 350 sessions. Gold-AST replay measures internal consistency against labels
    generated by the same engine, while author-written protocol simulations illustrate
    selected design choices. Across three live-parser seeds on 52 sessions, session
    training and registered sibling augmentation raise conditional micro target-constraint
    agreement from 18.0% to 83.7%. The final configuration has 100% coarse status
    agreement but only 75.0% conflict-member agreement, and includes a rule informed
    by a test-session failure. We therefore treat these results as descriptive, not
    as an unbiased generalization estimate. We define a stricter joint-turn criterion
    and report the bounds supported by the available aggregates. The contribution
    is a protocol for exposing inspectable solver evidence and the remaining gap between
    encoded feasibility and user-intent correctness.
  archival: true
