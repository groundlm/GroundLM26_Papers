  title: Evidence-Indexed Slide Narration With Heuristic Checks and Template Fallback
  abstract: Slide narration generation can introduce unsupported visual or decorative
    claims. We describe a pipeline that indexes slide content with deterministic identifiers,
    generates an internally cited template, and applies heuristic checks before and
    after an optional language-model rewrite. A narration-stage study covers 30 publicly
    sourced presentations (279 slides). The same decks and procedure were used, but
    stochastic vision evidence was regenerated by condition. In one run per condition,
    the complete configuration produced 5/279 proxy flags (1.79%) versus 22/279 (7.89%)
    for A1, a 77.3% relative difference (slide-paired exact p ≈ 2.2 × 10⁻⁴; deck-blocked
    p = 0.0156); B produced 20/279 (7.17%). Saved labels mark 225/279 condition-C
    outputs as template fallbacks. Post-rewrite verdicts were not saved, and six outputs
    retained model narration when no nonempty verified template was available. The
    proxy has F1 = 0.60 against judgments based on extracted context rather than rendered
    slides. These are observed system-level proxy rates, not component attribution
    or evidence that hallucination is eliminated.
